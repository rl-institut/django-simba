{% extends 'core/base.html' %}
{% block content %}
  <head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  </head>
  <body>
    {% if not geoms %}<h2> No stations found</h2>{% endif %}
    {% if error %}<h2> {{error }}</h2>{% endif %}
    <div id="map" style="height:1000px;"></div>
    {{ geoms|json_script:"geoms" }}
  </body>

  <script>
    let geoms = JSON.parse(document.getElementById('geoms').textContent);
    var map = L.map('map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // bundle all result markers in FeatureGroup to get bounding box
    const group = L.featureGroup();
    for (const geom of geoms) {
      let marker = L.marker([geom.lat, geom.lon]);
      marker.bindPopup(geom.popup);
      marker.addTo(group);
    }
    group.addTo(map);

    if (geoms.length) {
      // show all results on initial view
      map.fitBounds(group.getBounds());
    } else {
      // no geoms: show complete map
      map.fitWorld();
    }
  </script>
{% endblock content %}
