    /* Styling for the toggle container */
    .toggle {
      cursor: pointer;
      display: inline-block;
    }

    /* Styling for the toggle switch */
    .toggle-switch {
      display: inline-block;
      background: #ccc;
      border-radius: 16px;
      width: 58px;
      height: 32px;
      position: relative;
      vertical-align: middle;
      transition: background 0.25s;
    }

    /* Styling for the switch's before and after pseudo-elements */
    .toggle-switch:before,
    .toggle-switch:after {
      content: "";
    }

    /* Styling for the switch's before pseudo-element */
    .toggle-switch:before {
      display: block;
      background: linear-gradient(to bottom, #fff 0%, #eee 100%);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      width: 24px;
      height: 24px;
      position: absolute;
      top: 4px;
      left: 4px;
      transition: left 0.25s;
    }

    /* Change styles on hover */
    .toggle:hover .toggle-switch:before {
      background: linear-gradient(to bottom, #fff 0%, #fff 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
    }

    /* Styling for the checkbox when checked */
    .toggle-checkbox:checked + .toggle-switch {
      background: #56c080;
    }

    /* Additional styling for the switch's before pseudo-element when checked */
    .toggle-checkbox:checked + .toggle-switch:before {
      left: 30px;
    }

    /* Styling for the toggle checkbox */
    .toggle-checkbox {
      position: absolute;
      visibility: hidden;
    }

    /* Styling for the toggle label */
    .toggle-label {
      margin-left: 5px;
      position: relative;
      top: 2px;
    }

        // Function to calculate the closest point on a line to a given point
        function closestPointOnLine(point, lineStart, lineEnd) {
            var line = turf.lineString([lineStart, lineEnd]);
            return turf.nearestPointOnLine(line, point).geometry.coordinates;
        }

        // Function to calculate the heading (angle) between two points
        function calculateHeading(point1, point2) {
            // Convert coordinates from WGS84 to UTM using Proj4js
            const utmpoint1 = proj4("EPSG:4326", "EPSG:32633", point1);
            const utmpoint2 = proj4("EPSG:4326", "EPSG:32633", point2);
            var angle = Math.atan2(utmpoint2[1] - utmpoint1[1], utmpoint2[0] - utmpoint1[0]);
            return angle * (180 / Math.PI); // Convert to degrees
        }


         // Define source and target projections
        proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");
        proj4.defs("EPSG:32633", "+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs");
        var cc = 0;



                // Event listeners
        let lastExecutionTime = 0;
        let cc = 0;
        window.addEventListener('mousemove', function (e) {
            // Update cursor position to follow the mouse
            cursor.style.left = e.clientX-0.5 * (cursorwidth * currentScale)  + 'px';
            cursor.style.top = e.clientY+ (window.scrollY)-0.5 * (cursorheight * currentScale) + 'px';

             const currentTime = Date.now();




            if (zoom > 16) {

                if (currentTime - lastExecutionTime >= 10000) {

                        // Perform your operation here
                        var bounds = map.getBounds(); // Get the current visible bounds
                    var overpassQuery = `[out:json];
                      (
                        way["highway"](${bounds.getSouth()}, ${bounds.getWest()}, ${bounds.getNorth()}, ${bounds.getEast()});
                      );
                      out geom;`;

                    fetch('https://overpass-api.de/api/interpreter?', {
                      method: 'POST',
                        headers: {
                          'Accept': 'application/json',
                          'Content-Type': 'application/json'
                        },
                      body: overpassQuery,
                    })
                      .then(response => response.json())
                      .then(data => {
                            console.log(data);
                            features = data.elements
                      })
                      .catch(error => {
                        console.error('Error querying Overpass API:', error);
                      });



                        // Update the last execution time
                        lastExecutionTime = currentTime
                      }



                // Get the nearest street feature to the cursor
                if (features != features_old) {
                    markers = []
                    latlng = map.unproject([e.clientX-75, e.clientY-50])
                    features_old = features

                    var closestStreet = null;
                    var closestPointOnStreet = null;
                    var minDistance = Infinity;
                    var overallMinDistance = Infinity;
                    // Iterate through the list of streets
                    for (var i = 0; i < features.length; i++) {
                        var street = features[i];
                        var minDistance = Infinity; // Initialize minimum distance to a high value
                        var closestPointOnStreet;

                        if (street.geometry.type === 'LineString') {
                          // For LineString
                          var coordinates = street.geometry.coordinates;
                          for (var j = 0; j < coordinates.length - 1; j++) {
                            var segmentStart = coordinates[j];
                            var segmentEnd = coordinates[j + 1];

                            // Calculate the closest point on the segment to the cursor
                            var closestPoint = closestPointOnLine([latlng.lng, latlng.lat], segmentStart, segmentEnd);

                            // Calculate the distance between the cursor and the closest point on this segment
                            var distance = turf.distance([latlng.lng, latlng.lat], closestPoint)

                            // Update the closest point on the street if this segment is closer
                            if (distance < overallMinDistance) {
                              overallMinDistance = distance;
                              closestStreet = street;
                              closestSegment = [segmentStart, segmentEnd]
                              overallClosestPointOnStreet = closestPoint;
                            }
                          }
                        } else if (street.geometry.type === 'MultiLineString') {
                          // For MultiLineString
                          var lines = street.geometry.coordinates;
                          for (var j = 0; j < lines.length; j++) {
                            var coordinates = lines[j];
                            for (var k = 0; k < coordinates.length - 1; k++) {
                              var segmentStart = coordinates[k];
                              var segmentEnd = coordinates[k + 1];

                              // Calculate the closest point on the segment to the cursor
                              // Calculate the closest point on the segment to the cursor
                                var closestPoint = closestPointOnLine([latlng.lng, latlng.lat], segmentStart, segmentEnd);

                                // Calculate the distance between the cursor and the closest point on this segment
                                var distance = turf.distance([latlng.lng, latlng.lat], closestPoint)

                              // Update the closest point on the street if this segment is closer
                              if (distance < overallMinDistance) {
                                overallMinDistance = distance;
                                closestStreet = street;
                                closestSegment = [segmentStart, segmentEnd]
                                overallClosestPointOnStreet = closestPoint;
                              }
                            }
                          }
                        }

                    }
                    cc+=1;

                    //    .addTo(map);
                    // Calculate the heading (angle) of the closest street
                    console.log(closestStreet)
                    var heading = calculateHeading(closestSegment[0], closestSegment[1]);

                    // Rotate your cursor (rectangular box) to match the street's heading
                    // Set the rotation value for your cursor here
                    console.log("HEADING: ", heading)

            function addRectangle(coordinates, sourceName, layerName) {
              // Convert the rotation angle from degrees to radians
              rotationAngle= -curr_angle;
              var radians = (rotationAngle * Math.PI) / 180;
              console.log("ORIGINAL: ", [coordinates.lng,coordinates.lat])

              const pnt = proj4("EPSG:4326", "EPSG:32633", [coordinates.lng,coordinates.lat]);

            //const utmpoint2 = proj4("EPSG:4326", "EPSG:32633", point2);

              // Define the rectangle's initial coordinates
              var initialCoordinates = [
                [pnt[0] - 9, pnt[1] - 1.5],
                [pnt[0] + 9, pnt[1] - 1.5],
                [pnt[0] + 9, pnt[1] + 1.5],
                [pnt[0] - 9, pnt[1] + 1.5],
                [pnt[0] - 9, pnt[1] - 1.5]
              ];

              // Rotate the rectangle's coordinates
              var rotatedCoordinates = initialCoordinates.map(function (point) {


                  console.log("PNT: ", pnt, point)
                var x = point[0] - pnt[0];
                var y = point[1] - pnt[1];

                // Apply rotation
                var newX = x * Math.cos(radians) - y * Math.sin(radians);
                var newY = x * Math.sin(radians) + y * Math.cos(radians);

                var rot_coords = [newX + pnt[0], newY + pnt[1]];
                var result = proj4("EPSG:32633","EPSG:4326",  rot_coords);
                console.log("RESULT::: ", result)
                return result
              });

              var rectangleGeoJSON = {
                type: 'FeatureCollection',
                features: [
                  {
                    type: 'Feature',
                    geometry: {
                      type: 'Polygon',
                      coordinates: [rotatedCoordinates]
                    }
                  }
                ]
              };

              // Add the rectangle GeoJSON as a source with the unique source name
              map.addSource(sourceName, {
                type: 'geojson',
                data: rectangleGeoJSON
              });

              // Style the rectangle layer with the unique layer name
              map.addLayer({
                id: layerName,
                type: 'fill',
                source: sourceName,
                paint: {
                  'fill-color': 'orange',
                  'fill-opacity': 0.5
                }
              });
            }

        // Function to toggle layer visibility
        function toggleLayerVisibility(layerId) {
            var layer = map.getLayer(layerId);
            var visibility = map.getLayoutProperty(layerId, 'visibility');

            if (visibility === 'visible') {
                map.setLayoutProperty(layerId, 'visibility', 'none');
            } else {

            }
        }

        layers.forEach(function (layer) {

             const toggleLabel = document.createElement("label");
            toggleLabel.className = "toggle";

            const toggleCheckbox = document.createElement("input");
            toggleCheckbox.className = "toggle-checkbox";
            toggleCheckbox.type = "checkbox";
            toggleCheckbox.checked = true;

            toggleCheckbox.addEventListener('change', function () {
                            toggleLayerVisibility(layer.id);
                        });

            const toggleSwitch = document.createElement("div");
            toggleSwitch.className = "toggle-switch";

            const toggleLabelText = document.createElement("span");
            toggleLabelText.className = "toggle-label";
            toggleLabelText.textContent = layer.name;

            toggleLabel.appendChild(toggleCheckbox);
            toggleLabel.appendChild(toggleSwitch);
            toggleLabel.appendChild(toggleLabelText);


            layerControls.appendChild(toggleLabel);

            },
            data: {},
            success: function(data) {
                    // Create a Blob containing the JSON data

                    // Create a temporary anchor element to trigger the download
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "electrified_stations.json";

                }
        })
    }

                );
            }
        });

        // previously hovered feature.
        map.on('mouseleave', 'flur', () => {
            if (hoveredStateId) {
