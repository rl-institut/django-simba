    .fixed-div {

    /* Apply box-sizing to all elements and pseudo-elements */
    *,
    *:before,
    *:after {
      box-sizing: border-box;
    }

    /* Define the body font family */
    body {
      font-family: -apple-system, ".SFNSText-Regular", "Helvetica Neue", "Roboto", "Segoe UI", sans-serif;
    }

    /* Styling for the toggle container */
    .toggle {
      cursor: pointer;
      display: inline-block;
    }

    /* Styling for the toggle switch */
    .toggle-switch {
      display: inline-block;
      background: #ccc;
      border-radius: 16px;
      width: 58px;
      height: 32px;
      position: relative;
      vertical-align: middle;
      transition: background 0.25s;
    }

    /* Styling for the switch's before and after pseudo-elements */
    .toggle-switch:before,
    .toggle-switch:after {
      content: "";
    }

    /* Styling for the switch's before pseudo-element */
    .toggle-switch:before {
      display: block;
      background: linear-gradient(to bottom, #fff 0%, #eee 100%);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      width: 24px;
      height: 24px;
      position: absolute;
      top: 4px;
      left: 4px;
      transition: left 0.25s;
    }

    /* Change styles on hover */
    .toggle:hover .toggle-switch:before {
      background: linear-gradient(to bottom, #fff 0%, #fff 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
    }

    /* Styling for the checkbox when checked */
    .toggle-checkbox:checked + .toggle-switch {
      background: #56c080;
    }

    /* Additional styling for the switch's before pseudo-element when checked */
    .toggle-checkbox:checked + .toggle-switch:before {
      left: 30px;
    }

    /* Styling for the toggle checkbox */
    .toggle-checkbox {
      position: absolute;
      visibility: hidden;
    }

    /* Styling for the toggle label */
    .toggle-label {
      margin-left: 5px;
      position: relative;
      top: 2px;
    }



</style>

        function toggleLayerVisibility(layerId) {
            var layer = map.getLayer(layerId);
            var visibility = map.getLayoutProperty(layerId, 'visibility');

            if (visibility === 'visible') {

            } else {
