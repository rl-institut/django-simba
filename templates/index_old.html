<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBus-Toolbox</title>
  {% load static %}
  <link rel="stylesheet" href=  "{% static 'styles.css'%}">
  <link rel="stylesheet" href="{% static 'mystyle.css'%}">

</head>

<body>
  <!-- used for loading html from differnt file -->
  <!-- <div w3-include-html="common.html"></div> -->

  <div class="container py-4 px-0 mx-auto">

    <!-- Start Top Bar -->
    <header class="d-flex justify-content-between align-items-md-center pb-3 mb-5 border-bottom">
      <h1 class="h4">
        <a href="/" class="d-flex align-items-center text-dark text-decoration-none">
          <div class="logo">
            <img class="img-fluid" id="logo" src="https://reiner-lemoine-institut.de//wp-content/uploads/2015/09/rlilogo.png" data-retina="" data-height="" alt="Reiner Lemoine Institut" data-no-retina="">
          </div>
          <span>RLI</span>
        </a>
      </h1>
    </header>
    <!-- End Top Bar -->

    <div class="callout tiny primary">
      <div class="row column text-center">
        <h1>
          <div class="title">eBus-Toolbox</div>
        </h1>
        <h3>Drive For Perfection</h3>
      </div>
    </div>

    <!-- left side  -->
    <div class="row">
      <div class="col-md-6">
        <div class="row">
          <div class="col-md-3">
            <nav class="nav flex-column nav-pills" id="tab-a"> <!-- alternativ to pills: underline -->
              <button class="nav-link active" id="1v" data-bs-toggle="tab" data-bs-target="#panel1v" type="button" role="tab" aria-controls="panel1v" aria-selected="true">Hauptmenü</button>
              <button class="nav-link" id="2v" data-bs-toggle="tab" data-bs-target="#panel2v" type="button" role="tab" aria-controls="panel2v" aria-selected="false">Umlaufdaten</button>
              <button class="nav-link" id="3v" data-bs-toggle="tab" data-bs-target="#panel3v" type="button" role="tab" aria-controls="panel3v" aria-selected="false">Fahrzeugdaten</button>
              <button class="nav-link" id="4v" data-bs-toggle="tab" data-bs-target="#panel4v" type="button" role="tab" aria-controls="panel4v" aria-selected="false">Elektrifizierte Stationen</button>
              <button class="nav-link" id="5v" data-bs-toggle="tab" data-bs-target="#panel5v" type="button" role="tab" aria-controls="panel5v" aria-selected="false">Erweiterte Einstellungen</button>
              <button class="nav-link" id="6v" data-bs-toggle="tab" data-bs-target="#panel6v" type="button" role="tab" aria-controls="panel6v" aria-selected="false">Depotsimulation</button>
            </nav>
          </div>

          <div class="col-md-9">
            <div class="tab-content vertical" id="tab-a-content">
              <!-- Start Tab Content -->
              <div class="tab-pane active" id="panel1v" role="tabpanel" aria-labelledby="1v" tabindex="0">
                <div class="card round scrollable-div">
                  <div class="card-header rli_color">
                    <h4 class="card-title">Allgemeine Einstellungen</h4>
                  </div>
                  <div class="card-body">
                    <p><strong>Bevorzugter Ladetyp</strong></p>
                    <div class="form-check">
                      <input class="form-check-input" id="exampleRadioSwitch1" type="radio" name="testGroup" checked>
                      <label class="form-check-label" for="exampleRadioSwitch1">Gelegenheitslader</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" id="exampleRadioSwitch2" type="radio" name="testGroup">
                      <label class="form-check-label" for="exampleRadioSwitch2">Depotlader</label>
                    </div>
                
                    <p><strong>Konsistenz-Prüfung</strong></p>
                    <div class="form-check form-switch">
                      <input class="form-check-input" id="konsistenzSwitch" type="checkbox" checked name="testGroup">
                      <label class="form-check-label" for="konsistenzSwitch" data-bs-toggle="tooltip" data-bs-placement="top" title="Konsistenz Prüfung">
                      <a>Aktiv?</a>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
              <!-- End Tab Content -->
            </div>
          </div>
        </div>
      </div>
      <!-- Right side -->
      <div class="col-md-6">
        <nav>
          <div class="nav nav-tabs" id="tab" role="tablist">
            <button class="nav-link active" id="nav-map-tab" data-bs-toggle="tab" data-bs-target="#nav-map" type="button" role="tab" aria-controls="nav-map" aria-selected="true">Kartenansicht</button>
            <button class="nav-link" id="nav-1-tab" data-bs-toggle="tab" data-bs-target="#nav-1" type="button" role="tab" aria-controls="nav-1" aria-selected="false">2</button>
            <button class="nav-link" id="nav-2-tab" data-bs-toggle="tab" data-bs-target="#nav-2" type="button" role="tab" aria-controls="nav-2" aria-selected="false">3</button>
            <button class="nav-link" id="nav-3-tab" data-bs-toggle="tab" data-bs-target="#nav-3" type="button" role="tab" aria-controls="nav-3" aria-selected="false">4</button>
            <button class="nav-link" id="nav-4-tab" data-bs-toggle="tab" data-bs-target="#nav-4" type="button" role="tab" aria-controls="nav-4" aria-selected="false">5</button>
            <button class="nav-link" id="nav-5-tab" data-bs-toggle="tab" data-bs-target="#nav-5" type="button" role="tab" aria-controls="nav-5" aria-selected="false">6</button>
        </nav>
        <div class="tab-content"  id="tabContent">
          <!-- Start Tab Content -->
          <div class="tab-pane active" id="nav-map" role="tabpanel" aria-labelledby="nav-map-tab" tabindex="0">
            <h3>Karten</h3>
            <p>Karte</p>
          </div>          
          <div class="tab-pane" id="nav-1" role="tabpanel" aria-labelledby="nav-1-tab" tabindex="0">
            <h2>Test</h2>
            <p>Hello.</p>
          </div>
          <!-- End Tab Content -->
        </div>

      </div>
    </div>
  </div>

  {% load static %}
  <script src="{% static 'jquery/dist/jquery.min.js'%}"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js" integrity="sha384-zYPOMqeu1DAVkHiLqWBUTcbYfZ8osu1Nd6Z89ify25QV9guujx43ITvfi12/QExE" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js" integrity="sha384-Y4oOpwW3duJdCWv5ly8SCFYWqFDsfob/3GkgExXKV4idmbt98QcxXYs9UoXAB7BZ" crossorigin="anonymous"></script>
</body>

</html>
