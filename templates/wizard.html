
<script>
document.addEventListener("DOMContentLoaded", function() {
    var navItems = document.querySelectorAll('.nav-item');
    var progressBar = document.querySelector('#progress-wizard');

    const path = String(window.location.pathname);

    var progress = 0;
    const tabs = ["schedule","simulation_parameters", "vehicle_types", "depots", "stations", "scenario_overview"];
    // disable all navitems by default and make them not active
    for (let nav of navItems) {
        nav.firstElementChild.classList.add('disabled');
        nav.firstElementChild.classList.remove('active');
    }
    // set progress bar, enable prior navitems
    for (let i=0; i<navItems.length; i++) {
        if (path.includes('/' + tabs[i] + '/')) {
            // found current tab
            // activate the tab
            document.getElementById("nav-link-" + tabs[i]).firstElementChild.classList.add('active');
            // update progress
            progress = (i + 1) * 100 / navItems.length;
            // enable all prior nav links
            for (j=0; j<=i; j++)
                document.getElementById("nav-link-" + tabs[j]).firstElementChild.classList.remove('disabled');
            break;
        }
    }

    // Calculate progress based on the number of nav items
    progressBar.style.width = progress + '%';
});
</script>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav justify-content-between w-100">
                <li id="nav-link-schedule" class="nav-item">
                    <a class="nav-link active" href="{% url 'simba:schedule' %}">Fahrplan</a>
                </li>
                              <li id="nav-link-simulation_parameters" class="nav-item">
                    <a class="nav-link" href="{% url 'simba:simulation_parameters' task_id=task_id%}">Simulations Parameter</a>
                </li>
                <li id="nav-link-vehicle_types" class="nav-item">
                    <a class="nav-link" href="{% url 'simba:vehicle_types' task_id=task_id %}">Fahrzeugtypen</a>
                </li>
                <li id="nav-link-depots" class="nav-item">
                    <a class="nav-link " href="{% url 'simba:depots' task_id=task_id %}">Depots</a>
                </li>
                <li id="nav-link-stations" class="nav-item">
                    <a class="nav-link" href="{% url 'simba:stations' task_id=task_id %}">Stationen</a>
                </li>
                <li id="nav-link-scenario_overview" class="nav-item">
                    <a class="nav-link" href="{% url 'simba:scenario_overview' task_id=task_id %}">Übersicht</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="progress">
 <div class="progress-bar" id="progress-wizard" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
</div>
