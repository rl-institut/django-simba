
<script>
document.addEventListener("DOMContentLoaded", function() {
    var navItems = document.querySelectorAll('.nav-item');
    var progressBar = document.querySelector('#progress-wizard');

    const path = String(window.location.pathname);
    console.log(path);

    var progress = 0
    if(path.includes("input/schedule/")) {
        var progress = 1 / navItems.length * 100;
    } else if(path.includes("input/vehicle_types")) {
        var progress = 2 / navItems.length * 100;
    } else if(path.includes("input/stations")) {
        var progress = 3 / navItems.length * 100;
    } else if(path.includes("input/depot")) {
        var progress = 4 / navItems.length * 100;
    } else if(path.includes("input/scenario_overview")) {
        var progress = 5 / navItems.length * 100;
    } else {
        progress = 0;
    }

    // Calculate progress based on the number of nav items
    progressBar.style.width = progress + '%';
    progressBar.classList.add('active');
});
</script>

<p>{{ request.path }}</p>
