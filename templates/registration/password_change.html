{% extends 'base.html' %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}
<main class="sticky-f__main">
  <div class="grid-x grid-padding-x align-center">
    <div class="cell medium-6 large-3">
      <form id=form method="post" >
        {% csrf_token %}
        <div>
          <label for="id_old_password">Altes Passwort</label>
          {{form.old_password}}
        </div>
        {{form.old_password.errors}}
        <div>
          <label for="id_new_password1">Neues Passwort</label>
          {{form.new_password1}}
        </div>
        {{form.new_password1.errors}}
        <div>
          <label for="id_new_password2">Neues Passwort wiederholen</label>
          {{form.new_password2}}
        </div>
        {{form.new_password2.errors}}
        <input class=button type="submit" name="updatePW" value="Passwort aktualisieren"/>
      </form>
    </div>
  </div>
</main>
{% endblock %}
