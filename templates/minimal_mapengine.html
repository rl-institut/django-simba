        // When the user moves their mouse over the state-fill layer, we'll update the
        // feature state for the feature under the mouse.
    hoveredStateId = null;
        map.on('mousemove', 'flur', (e) => {
            if (e.features.length > 0) {
                if (hoveredStateId) {
                    map.setFeatureState(
                        {source: 'busstop', sourceLayer:'flur', id: hoveredStateId},
                        {hover: false}
                    );
                }
                hoveredStateId = e.features[0].id;
                map.setFeatureState(
                    {source: 'busstop', sourceLayer:'flur', id: hoveredStateId},
                    {hover: true}
                );
            }
        });

        // When the mouse leaves the state-fill layer, update the feature state of the
        // previously hovered feature.
        map.on('mouseleave', 'flur', () => {
            if (hoveredStateId) {
                map.setFeatureState(
                    {source: 'busstop', sourceLayer:'flur', id: hoveredStateId},
                    {hover: false}
                );
            }
            hoveredStateId = null;
        });

    map.on('click', 'myexamplemultipolygon', (e) => {
        //https://stackoverflow.com/questions/47576527/how-to-manipulate-event-bubbling-when-registering-click-event-upon-a-layer-in-ma
       e.originalEvent.preventDefault();
        var latlon = [e["lngLat"]['lng'], e["lngLat"]['lat']];
        if (true) {


            var innerHTML = `
                <div style="text-align: center;">
                    Delete Bus with id: ${e.features[0].id} and quality ${e.features[0].properties['quality']} ?
                </div>
                <div>
                    <button onclick="onYesClick(${e.features[0].id})">Yes</button>
                    <button onclick="onNoClick()">No</button>
                </div>
            `;


            console.log("Bus clicked!", e, latlon);
            requestAnimationFrame(() => {
                popup = new maplibregl.Popup({
                    // https://maplibre.org/maplibre-gl-js-docs/api/markers/#popup-parameters
                    maxWidth: "280px",
                }).setLngLat(latlon).setHTML(innerHTML).addTo(map);
            });
        }
        ;
    });


    map.on('click', 'flur', (e) => {
        var latlon = [e["lngLat"]['lng'], e["lngLat"]['lat']];
        //https://stackoverflow.com/questions/47576527/how-to-manipulate-event-bubbling-when-registering-click-event-upon-a-layer-in-ma
        if(!e.originalEvent.defaultPrevented) {

            var features = map.queryRenderedFeatures(e.point);
            console.log("Flurstueck clicked!", features[0].geometry);

            var innerHTML = `
                <div style="text-align: center;">
                    Edit Area with id: ${e.features[0].id} ?
                </div>
                <div>
                    <button onclick="EditFlurstueck('${encodeURIComponent(JSON.stringify(features[0].geometry))}',${e.features[0].id} )">Yes</button>
                    <button onclick="onNoClick()">No</button>
                </div>
            `;


            requestAnimationFrame(() => {
                popup = new maplibregl.Popup({
                    // https://maplibre.org/maplibre-gl-js-docs/api/markers/#popup-parameters
                    maxWidth: "280px",
                }).setLngLat(latlon).setHTML(innerHTML).addTo(map);
            });
        }
        ;

}
