{% extends 'base.html'%}
{% block content %}
    <div class="row">
    {{task_id  }}
        <form id='form' hx-swap="none" hx-encoding='multipart/form-data' hx-post='{% url 'simba:upload_trips' task_id%}'>{% csrf_token %}
        <input type='file' name='file'>
        <button>
            Upload
        </button>
        <progress id='progress' value='0' max='100'></progress>
    </form>

    <script>
        htmx.on('#form', 'htmx:xhr:progress', function(evt) {
          htmx.find('#progress').setAttribute('value', evt.detail.loaded/evt.detail.total * 100)
        });
    </script>

</div>
{% endblock %}
