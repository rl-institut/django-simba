<script>
    var notifications;
    function fetchNotificationData(url){
      console.log(url);
        return fetch(url)
            .then(response => response.json())
            .then(data => {
             notifications = data;
          console.log(data);
            })
            .catch(error => {
                console.error('Error fetching Notifications', error);
            });
    }
    function renderNotification(){
      function setItems(type){
        container= document.getElementById(type+"Count");
        container.style.display ="";
        document.getElementById(type);
        container= document.querySelector(".notification[id^="+type+"]");
        container.style.display ="";
        let i = 1;
        notifications[type].forEach((notification) =>{
          var list_item = document.querySelector(".notification-list-item[id^="+type+"]");
          var copy = list_item.cloneNode();
          copy.id = copy.id+i;
          i ++;
          list_item.parentNode.appendChild(copy);
          copy.style.display="";
          copy.innerText = notification.fields.message;
        })
      }
      var num_errors = notifications["error"].length
      var num_warnings = notifications["warning"].length
      var num_infos = notifications["info"].length
      if  (num_errors+ num_warnings + num_infos) {
        MultiNotificationDiv.style.display="";
      }else {
        MultiNotificationDiv.style.display="None";
      }
      if (num_errors >0){
        errorSummary.innerText = num_errors + " Fehler";
        setItems("error") ;
      }
      if (num_warnings >0){
        warningSummary.innerText = num_warnings+ " Warnungen";
        setItems("warning") ;
      }
      if (num_infos >0){
        infosSummary.innerText = num_infos + " Hinweise";
        setItems("info") ;
      }
      }

    async function fetchAndRenderNotifications() {
      await fetchNotificationData('{{url}}');
      console.log('fetched');
      renderNotification()
    }
  // Function to toggle smoothly alert details expansion state
  document.addEventListener("DOMContentLoaded", ()=> {
  const button = document.getElementById('MultiNotificationButton');
  console.assert(button);
  button.addEventListener('click', ()=> {
    const content = button.nextElementSibling;
    const label = button.querySelector('[data-label]');
    const expanded = content.getAttribute('data-expanded') === 'true';

    if (expanded) {
      // collapse
      content.style.height = content.scrollHeight + 'px'; // set current height
      requestAnimationFrame(() => {
        content.style.height = '0px';
        content.setAttribute('data-expanded', 'false');
      });
      label.textContent = 'Details anzeigen';
    } else {
      // expand
      content.style.height = content.scrollHeight + 'px';
      content.setAttribute('data-expanded', 'true');
      label.textContent = 'Details ausblenden';

      // reset height after animation for auto layout
      content.addEventListener('transitionend', function resetHeight() {
        content.style.height = 'auto';
        content.removeEventListener('transitionend', resetHeight);
      });
    }

  })
  }
  );


</script>
