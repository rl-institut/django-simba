{% load widget_tweaks %}
<!-- Dropdown with the following inputs -->
<!-- field which is an input which has the value/id of the choice of the dropdown -->
<!-- label as DropdownLabel -->
<!-- choices with the attribute id and name -->
<!-- placeholder when no item is selected -->
      <div class="w-4/12 space-x-4 dropdown-container">
        <div>
    {{ field|add_class:"dropdown-input"}}
          <label id="listbox-label-{{field.auto_id}}" class="block text-sm font-medium text-slate-800">
            {{label}}
          </label>
          <div class="relative mt-2 focus-within:outline focus-within:outline-2 focus-within:outline-green-500 rounded-md outline outline-1 -outline-offset-1 outline-slate-400">
            <!-- Button that toggles the dropdown -->
            <button
        id="assignedToButton{{field.auto_id}}"
              type="button"
              class="grid w-full cursor-default grid-cols-1 rounded-md bg-white py-1.5 pl-3 pr-2 text-left text-slate-800 sm:text-sm/6 focus:outline-none dropdown-button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-labelledby="listbox-label"
            >
        <span id="assignedToLabel{{field.auto_id}}" class="col-start-1 row-start-1 truncate pr-6 dropdown-placeholder">{{placeholder}}</span>
              <svg
                class="col-start-1 row-start-1 size-5 self-center justify-self-end text-slate-500 sm:size-4"
                viewBox="0 0 16 16"
                fill="currentColor"
                aria-hidden="true"
                data-slot="icon"
              >
                <path
                  fill-rule="evenodd"
                  d="M5.22 10.22a.75.75 0 0 1 1.06 0L8 11.94l1.72-1.72a.75.75 0 1 1 1.06 1.06l-2.25 2.25a.75.75 0 0 1-1.06 0l-2.25-2.25a.75.75 0 0 1 0-1.06ZM10.78 5.78a.75.75 0 0 1-1.06 0L8 4.06 6.28 5.78a.75.75 0 0 1-1.06-1.06l2.25-2.25a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06Z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>

            <!-- Dropdown list -->
            <ul
        id="assignedToList{{field.auto_id}}"
              class="absolute z-10 mt-1 max-h-60 w-full overflow-auto rounded-md bg-white py-1 text-base shadow-lg ring-1 ring-black/5 focus:outline-none sm:text-sm hidden dropdown-choices"
              tabindex="-1"
              role="listbox"
              aria-labelledby="listbox-label">
                {% for choice in choices %}
                  <li class="relative cursor-pointer select-none py-2 pl-3 pr-9 text-slate-800 hover:bg-emerald-400 hover:text-black"
                      role="option"
                      data-dropdown-item="{{ choice.id }}"
                      data-dropdown-name="{{ choice.name }}">
                    <span class="block truncate font-normal">{{ choice.name }}</span>
                  </li>
                {% endfor %}
            </ul>
          </div>
        </div>
      </div>
