{% load i18n %}
{% if progress.success %}
<!-- Once the run is done the only thing left to do here is look at the results, so the button
     turns into the link to them instead of sitting greyed out next to a small text link. -->
<a
  href="{% url 'simba:result' scenario.task_id %}"
  data-value="simulateButton"
  class="block px-6 py-2 w-[16rem] rounded-full transition-all duration-300
    bg-blue-600 hover:bg-blue-700 hover:shadow-lg cursor-pointer"
>
  <div class="flex items-center justify-center gap-4">
    <div class="flex items-center text-white">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
      </svg>
    </div>
    <span class="flex flex-col text-left leading-tight text-white">
      <span class="text-sm font-normal">{% translate 'Simulation abgeschlossen' %}</span>
      <span class="text-base font-semibold tracking-wide">{% translate 'Zu den Ergebnissen' %}</span>
    </span>
  </div>
</a>
{% else %}
<!-- hx-select needs to be explicitly set to "everything",  -->
<!-- since without it the value would be inherited from the parent div -->
<button
  hx-get="{% url 'simba:merge_and_run' scenario.task_id %}"
  hx-select="*"
  hx-target="#simulationProgressAlert"
  data-value="simulateButton"
  class="px-6 py-2 w-[16rem]  text-black text-base font-semibold tracking-wide rounded-full transition-all duration-300
    {% if progress.running %}cursor-not-allowed bg-slate-200{% else %}
hover:bg-emerald-300 active:bg-emerald-500 bg-emerald-400 hover:shadow-lg cursor-pointer
    {% endif %}"
  {% if progress.running %}disabled{% endif %}
>
  <div class="flex align-center align-middle gap-4">
    <div class="flex items-center">
      <svg width="24" height="24" version="1.1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </div>
    <span class="text-slate-800 font-semibold button-text {% if progress.running %}loader{% endif %}">
      {% if not progress %}
      {% translate 'Simulation starten' %}
      {% elif not progress.running %}
      {% translate 'Erneut Simulieren' %}
      {% endif %}
    </span>
  </div>
</button>
{% endif %}
