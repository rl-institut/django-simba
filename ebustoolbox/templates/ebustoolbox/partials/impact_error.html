{% comment %}
A failed eflips-impact calculation on the result page.
message: what could not be calculated; error: the stored exception text
{% endcomment %}

  <p class="font-medium">{{ message }}</p>
  <p class="mt-2 text-sm font-mono break-words">{{ error }}</p>
</div>
