[tool.poetry]
name = "django-simba"
version = "0.1.0"
description = "Django Integration of [simBA](https://github.com/rl-institut/SimBA) and [eFLips-Depot](https://github.com/mpm-tu-berlin/eflips-depot)"
authors = ["Reiner Lemoine Institut <info@rl-institut.de>"]
license = "AGPLv3"
readme = "README.md"
packages = [{include = "ebustoolbox"},
            {include = "django_mapengine"},
            {include = "ebus_map"},
            {include = "elevation_api"},
            {include = "core"},
            {include = "ds_wrapper"},
            {include = "dash_app"},
           ]

[tool.poetry.dependencies]
python = ">=3.10, <3.12"
spice_ev = { git = "https://github.com/rl-institut/spice_ev", rev = "51268c639a02f2a94c418d6215376f585dd14af0"}
simba = { git = "https://github.com/rl-institut/SimBA", rev = "feature/django_simba"}

Django = "^5.0.0"
django-environ = ">=0.10.0, <1.0.0"
django-plotly-dash = "^2.2.1"
django-appconf = ">=1.0.5, <2.0.0"
djangorestframework = ">=3.14.0, <4.0.0"
djangorestframework-mvt = ">=0.2.5, <1.0.0"
django-distill = "^3.1.3"
django-geojson = "^4.0.0"


celery = "^5.3.1"
psycopg2-binary = "^2.9.6"
pandas = "^2.0.3"
matplotlib = "^3.7.2"
colorbrewer = { git = "https://github.com/henhuy/colorbrewer-python.git" }
range-key-dict = "^1.1.0"
django-extensions = "^3.2.3"
selenium = "^4.13.0"
setuptools = "^68.2.2"
django-bootstrap4 = "23.4"
tqdm = "^4.66.1"
eflips-depot = ">=4.3.7, <5.0.0"
django-fast-update = "^0.2.3"
scipy = "^1.12.0"
eflips-ingest = "^1.2.3"
eflips-eval = "^1.0.6"
redis = "^5.0.5"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
flake8 = "^6.1.0"
selenium = "^4.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '^ebustoolbox/'
exclude = '''
/(
    # Exclude all directories except ebustoolbox
    (?!ebustoolbox/)

    # Exclude hidden directories (starting with a dot)
    (?!\\.[^/]+/)

    # Exclude any directory starting with underscore
    (?!_[^/]+/)
)
'''
