{% load i18n %}
<div class="flex flex-col items-center w-full">
  <div class="w-full max-w-7xl px-4 sm:px-6 lg:px-8 py-6">
    <!-- Error section -->
    <div class="bg-red-50 border border-red-200 text-red-800 rounded-md px-4 py-3 mb-6" role="alert">
      <h3 class="font-semibold mb-1">{{ status }}</h3>
      <ul class="list-disc list-inside text-sm">
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    </div>

    <!-- Progress bar -->
    <div class="w-full bg-slate-200 rounded-md overflow-hidden h-4 mb-4" aria-labelledby="pblabel">
      <div
        class="bg-emerald-600 text-white text-xs font-semibold text-center h-full transition-all duration-300"
        style="width: {{ current_progress|floatformat:0 }}%; background-color: #60a5fa">
        {{ current_progress|floatformat:1 }}%
      </div>
    </div>
  </div>
</div>
