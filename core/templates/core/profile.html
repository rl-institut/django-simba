{% extends 'core/base.html'%}

{% block title %}
  WeBus - Profil
{% endblock title %}

{% block content %}
<main class="flex flex-col items-center flex-grow">
  <div class="sm:py-8 lg:py-12 sm:px-6 lg:px-8 w-full max-w-7xl">
    <h1 class="pb-12 text-2xl text-slate-600 font-light tracking-wide uppercase">Profil</h1>
    <section class="tab-content pb-12 lg:w-1/2" id="content-summary">
      <div class="pt-8">
        <p class="text-slate-800 font-semibold tracking-wide pb-2">Name</p>
        <div class="flex justify-between items-center bg-white rounded-lg p-4 text-sm tracking-wide gap-4">
          <p>Markus Schmidt</p>
          <div>
            <a href="#" class="flex items-center gap-2 text-green-600 text-sm font-bold hover:text-green-500 focus:text-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
              </svg>
              Editieren
            </a>
          </div>
        </div>
      </div>
      <div class="pt-8">
        <p class="text-slate-800 font-semibold tracking-wide pb-2">E-Mail-Adresse</p>
        <div class="flex justify-between items-center bg-white rounded-lg p-4 text-sm tracking-wide gap-4">
          <p>{{ user.email }}</p>
          <div>
            <a href="#" class="flex items-center gap-2 text-green-600 text-sm font-bold hover:text-green-500 focus:text-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
              </svg>
              Editieren
            </a>
          </div>
        </div>
      </div>
      <div class="pt-8">
        <a
          href="{% url 'core:password_change' %}"
          class="flex items-center gap-2 px-4 py-2 w-fit rounded-full bg-slate-800 text-white text-sm font-medium focus:outline-none"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
          </svg>
          <span>
            Passwort ändern
          </span>      
        </a>
      </div>
    </section>
  </div>
</main>
{% endblock %}
