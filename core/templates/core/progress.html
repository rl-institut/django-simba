<h3 role="status" id="pblabel" tabindex="-1" autofocus>{{ status }}</h3>
<ul class="text-start">
  {% for error in errors %}
    <li>{{ error }}</li>
  {% endfor %}
</ul>

        {{ current_progress }}%
    </div>
</div>
