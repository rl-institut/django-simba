{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="{% static 'core/images/WB.svg' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% tailwind_css %}
    <title>WeBus</title>
  </head>
  <body class="bg-gradient-to-br from-gradient1 via-gradient2 to-gradient3 min-h-lvh flex flex-col">
    {% include 'core/navbar.html'%}

    <main class="flex-grow flex flex-col items-center justify-center text-center px-4">
      <img class="h-32 w-auto mt-8 mb-8" src="{% static 'core/images/logo/webus_white.svg' %}" alt="WeBus">
      <p class="mt-4 text-xl text-slate-800 max-w-3xl">
        Entwicklung und Analyse von Strategien zur vollständigen Dekarbonisierung des Berliner Busverkehrs bis 2030
      </p>
      <div class="mt-8 flex space-x-4">
        <a href="{% url 'simba:trips' %}" class="px-6 py-2 bg-slate-800 text-white text-base font-semibold tracking-wide rounded-full hover:bg-black hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black active:bg-slate-900 transition-all duration-300">
          Starten
        </a>
<!--
        <button class="px-6 py-2 border-2 border-slate-800 text-slate-800 text-base font-semibold tracking-wide rounded-full hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black active:bg-slate-100 transition-all duration-300">
          Mehr erfahren
        </button>
-->
      </div>
    </main>

    <footer class="bg-slate-800 text-white">
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <ul class="flex justify-center space-x-6 text-sm">
<!--
          <li><a href="#" class="hover:underline">Kontakt</a></li>
-->
          <li><a href="{% url 'core:legal' %}" class="hover:underline">Impressum</a></li>
          <li><a href="{% url 'core:privacy' %}" class="hover:underline">Datenschutz</a></li>
        </ul>
      </div>
    </footer>

<!--
    <script type="module" src="/src/main.ts"></script>
-->
    <script>
      const menuButton = document.getElementById('menu-button');
      const closeButton = document.getElementById('close-menu');
      const mobileMenu = document.getElementById('mobile-menu');

      // Toggle menu
      menuButton.addEventListener('click', () => {
        const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
        menuButton.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.classList.toggle('hidden');
        mobileMenu.setAttribute('aria-hidden', isExpanded);
        if (!isExpanded) {
          mobileMenu.querySelector('a').focus(); // Focus the first menu item
        }
      });

      // Close menu
      closeButton.addEventListener('click', () => {
        menuButton.setAttribute('aria-expanded', 'false');
        mobileMenu.classList.add('hidden');
        mobileMenu.setAttribute('aria-hidden', 'true');
        menuButton.focus(); // Return focus to the button
      });

      // Trap focus within the mobile menu
      mobileMenu.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          const focusableElements = mobileMenu.querySelectorAll('a, button');
          const firstElement = focusableElements[0];
          const lastElement = focusableElements[focusableElements.length - 1];

          if (e.shiftKey && document.activeElement === firstElement) {
            e.preventDefault();
            lastElement.focus();
          } else if (!e.shiftKey && document.activeElement === lastElement) {
            e.preventDefault();
            firstElement.focus();
          }
        }
      });
    </script>
  </body>
</html>
