name: PostgreSQL service example
on: push

jobs:
  container-job:
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    # Docker Hub image that `container-job` executes in
    container: node:10.18-jessie

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    

    steps:
    - uses: actions/checkout@v3
    - name: Cache Poetry packages
      uses: actions/cache@v2
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
#    - name: Set Up Gdal
#      run: |
#        apt-get update
#        apt-get install gdal-bin
#        echo ogrinfo --version
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    - name: Install Dependency
      run: |
        poetry install --no-root
    - name: Run Tests
      run:
        poetry run python manage.py test
      env:
        DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DJANGO_DEBUG: True
        # Replace with your own database info
        DATABASE_URL: postgis://SomeUser:SomePassword@postgres/DbName
        CELERY_USE: False
        CELERY_BROKER_URL: pyamqp://guerrst@localhost//
        TILING_SERVICE_TOKEN: TilingSecret
        TILING_SERVICE_STYLE_ID: basic-v2
        DJANGO_SETTINGS_MODULE: ebusdjango.settings
        # The hostname used to communicate with the PostgreSQL service container
        POSTGRES_HOST: postgres
        # The default PostgreSQL port
        POSTGRES_PORT: 5432

