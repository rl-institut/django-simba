name: PostgreSQL Service Example
on: push
env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.4.2"
  POETRY_URL: https://install.python-poetry.org

jobs:
  # Label of the runner job
  Runner-job-of-Django-Tests-with-DB-Setup:
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgis/postgis
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
    # Downloads a copy of the code in your repository before running CI tests
    - name: Check out repository code
      uses: actions/checkout@v3
    - name: Set Up Gdal
      run: |
        sudo apt-get update
        sudo apt-get install gdal-bin
        echo ogrinfo --version

    - name: setup-chromedriver
      uses: nanasess/setup-chromedriver@v2.2.0

    - name: Set up Python $${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYTHON_VERSION }}

#    - name: Install poetry
#      run: |
#        python -m pip install --upgrade pip
#        pip install poetry

    # Poetry cache depends on OS, Python version and Poetry version.
    - name: Cache Poetry cache
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: poetry-cache-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ env.POETRY_VERSION }}
    # virtualenv cache should depends on OS, Python version and `poetry.lock` (and optionally workflow files).
    - name: Cache Packages
      uses: actions/cache@v3
      with:
        path: ~/.local
        key: poetry-local-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}-${{ hashFiles('.github/workflows/*.yml') }}
    - name: Install Poetry ${{ env.POETRY_VERSION }}
      run: |
        curl -sSL ${{ env.POETRY_URL }} | python - --version ${{ env.POETRY_VERSION }}
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Dependency
      run: |
        poetry config virtualenvs.in-project true
        poetry install --no-root
      #########
    - name: Run Tests
      run:
        poetry run python manage.py test
      env:
        DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DJANGO_DEBUG: True
        # Replace with your own database info
        DATABASE_URL: postgis://postgres:postgres@localhost/DbName
        CELERY_USE: False
        CELERY_BROKER_URL: pyamqp://guerrst@localhost//
        TILING_SERVICE_TOKEN: ${{ secrets.TILING_SERVICE_TOKEN }}
        TILING_SERVICE_STYLE_ID: basic-v2
        DJANGO_SETTINGS_MODULE: ebusdjango.settings
        # The hostname used to communicate with the PostgreSQL service container
        POSTGRES_HOST: localhost
        # The default PostgreSQL port
        POSTGRES_PORT: 5432


