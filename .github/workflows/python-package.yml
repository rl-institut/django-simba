name: Code tests
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.4.2"
  POETRY_URL: https://install.python-poetry.org

jobs:
  # Label of the runner job
  dev-tools:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black
      - name: flake8
        run: |
          flake8 ebus_map ebusdjango ebustoolbox
      - name: check black
        run: |
          black ebustoolbox/*.py --check
  Runner-job-of-Django-Tests-with-DB-Setup:
    needs: dev-tools
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgis/postgis
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      # Downloads a copy of the code in your repository before running CI tests
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Set Up Gdal
        run: |
          sudo apt-get update
          sudo apt-get install gdal-bin
          echo ogrinfo --version
      - name: Set Up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: setup-chromedriver
        uses: nanasess/setup-chromedriver@v2.2.0
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install Dependency
        run: |
          poetry install --no-root --with dev
      - name: Run Tests
        run:
          poetry run python manage.py test
        env:
          DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DJANGO_DEBUG: True
          # Replace with your own database info
          DATABASE_URL: postgis://postgres:postgres@localhost/DbName
          CELERY_USE: False
          CELERY_BROKER_URL: pyamqp://guerrst@localhost//
          TILING_SERVICE_TOKEN: ${{ secrets.TILING_SERVICE_TOKEN }}
          TILING_SERVICE_STYLE_ID: basic-v2
          DJANGO_SETTINGS_MODULE: ebusdjango.settings
          # The hostname used to communicate with the PostgreSQL service container
          POSTGRES_HOST: localhost
          # The default PostgreSQL port
          POSTGRES_PORT: 5432
